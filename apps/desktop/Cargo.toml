[package]
name = "orag-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ORAG desktop application: runs the orag service as a sidecar and shows its page"
publish = false

[lib]
name = "orag_desktop"
path = "src/lib.rs"

[[bin]]
name = "orag-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reads `gpu` from the sidecar home's config.toml (v0.6, src/gpu.rs).
toml = "1.1.6"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_Threading"] }
