name: desktop
# The Tauri desktop app (D-016): tests, lint and bundles on the three
# platforms. Separate from ci.yml because it needs the Tauri toolchain and
# WebKitGTK; the service's own CI does not build apps/desktop.
on:
  push:
    branches: [main, "step/**", "release-check/**"]
    paths:
      - "apps/desktop/**"
      - "crates/orag/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/stage-sidecar.sh"
      - "scripts/build-vulkan.sh"
      - "scripts/smoke-desktop.sh"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/orag/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/stage-sidecar.sh"
      - "scripts/build-vulkan.sh"
      - "scripts/smoke-desktop.sh"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundles: dmg
          - os: windows-2022
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      EXE: ${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install   # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - run: cargo install tauri-cli --version 2.12.3 --locked
      - run: cargo build --release --locked -p orag
      # Windows and Linux bundles carry orag-vulkan too (v0.6, step 86b):
      # the Vulkan SDK builds it; on Windows Ninja and the MSVC environment
      # (scripts/build-vulkan.sh), with MSVC's linker named for every later
      # cargo step because Git's /usr/bin/link shadows it in Git Bash. No
      # cache: ci.yml caches the same SDK version with the Windows runtime,
      # and the action's cache key does not say which one it holds.
      - if: ${{ !startsWith(matrix.os, 'macos') }}
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: 1.4.363.0
          stripdown: true
      - if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
      - if: startsWith(matrix.os, 'windows')
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$(cygpath -w "$(dirname "$(command -v cl)")/link.exe")" >> "$GITHUB_ENV"
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get install -y --no-install-recommends libvulkan1
      - if: ${{ !startsWith(matrix.os, 'macos') }}
        run: |
          scripts/build-vulkan.sh --release
          # The SDK action points LD_LIBRARY_PATH at its own loader; a user's
          # system has only the distribution's.
          env -u LD_LIBRARY_PATH scripts/check-binary-deps.sh "target/vulkan/release/orag-vulkan$EXE" --release-floor --vulkan
      - run: scripts/stage-sidecar.sh
      - run: cargo clippy --locked -p orag-desktop --all-targets -- -D warnings
      - run: cargo test --locked -p orag-desktop
        env:
          ORAG_REQUIRE_SIDECAR: "1"   # the containment test must not skip here
      - working-directory: apps/desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }} -- --locked
      # The built app with its sidecar next to it (target/release/orag).
      - name: Smoke test
        run: |
          app=target/release/orag-desktop
          if [ "$RUNNER_OS" = Windows ]; then app="$app.exe"; fi
          # Windows and Linux: the app tries orag-vulkan first and, on a
          # runner without a GPU, runs the CPU with the reason in its marker
          # (the missing-loader case is the missing-loader job below).
          gpu=()
          if [ "$RUNNER_OS" != macOS ]; then gpu=(--expect-gpu-fallback); fi
          if [ "$RUNNER_OS" = Linux ]; then
            env -u LD_LIBRARY_PATH xvfb-run -a scripts/smoke-desktop.sh "$app" "${gpu[@]}"
          else
            scripts/smoke-desktop.sh "$app" "${gpu[@]}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  # The installed Windows app on a PC with no Vulkan loader (v0.6 plan,
  # Task 4 Step 3): no Vulkan SDK on this runner, and a vulkan-1.dll the
  # image may ship is moved away first. The app must try orag-vulkan, show
  # no error window, and run on the CPU with the reason `loader-missing`.
  missing-loader:
    needs: bundle
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-windows-2022
          path: bundle
      - name: No Vulkan loader on this system
        shell: pwsh
        run: |
          foreach ($dir in @("$env:WINDIR\System32", "$env:WINDIR\SysWOW64")) {
            $dll = Join-Path $dir "vulkan-1.dll"
            if (Test-Path $dll) {
              takeown /f $dll | Out-Null
              icacls $dll /grant "$($env:USERNAME):F" | Out-Null
              Rename-Item $dll "vulkan-1.dll.moved"
              Write-Host "moved $dll"
            }
          }
          $found = Get-Command vulkan-1.dll -ErrorAction SilentlyContinue
          if ($found) { throw "vulkan-1.dll is still on PATH: $($found.Source)" }
      - name: Install the app
        shell: pwsh
        run: |
          $setup = Get-ChildItem bundle -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList "/S"
          $app = Get-ChildItem "$env:LOCALAPPDATA\ORAG" -Filter "*.exe" |
            Where-Object { $_.Name -notmatch '^(orag|orag-vulkan|uninstall)\.exe$' } | Select-Object -First 1
          if (-not $app) { throw "no installed app under $env:LOCALAPPDATA\ORAG" }
          foreach ($bin in @("orag.exe", "orag-vulkan.exe")) {
            if (-not (Test-Path (Join-Path $app.DirectoryName $bin))) { throw "the bundle has no $bin" }
          }
          "APP=$($app.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Smoke test on the CPU, reason loader-missing
        env:
          ORAG_EXPECT_GPU_REASON: loader-missing
        run: scripts/smoke-desktop.sh "$(cygpath -u "$APP")" --expect-gpu-fallback
