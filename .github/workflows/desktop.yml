name: desktop
# The Tauri desktop app (D-016): tests, lint and bundles on the three
# platforms. Separate from ci.yml because it needs the Tauri toolchain and
# WebKitGTK; the service's own CI does not build apps/desktop.
on:
  push:
    branches: [main, "step/**", "release-check/**"]
    paths:
      - "apps/desktop/**"
      - "crates/orag/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/stage-sidecar.sh"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/orag/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/stage-sidecar.sh"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundles: dmg
          - os: windows-2022
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install   # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo install tauri-cli --version 2.12.3 --locked
      - run: cargo build --release --locked -p orag
      - run: scripts/stage-sidecar.sh
      - run: cargo clippy --locked -p orag-desktop --all-targets -- -D warnings
      - run: cargo test --locked -p orag-desktop
        env:
          ORAG_REQUIRE_SIDECAR: "1"   # the containment test must not skip here
      - working-directory: apps/desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }} -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error
