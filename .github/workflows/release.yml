name: release
on:
  push:
    tags: ["v*"]
    # A `release-check/**` branch builds and packages every platform without a
    # release, so the packaging path is proven before a tag is pushed (the
    # orchestrator's token cannot dispatch workflows).
    branches: ["release-check/**"]
  workflow_dispatch:

# Read-only token: the build job uploads artifacts; only the draft job below may
# write, and it creates a draft the owner publishes.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: the oldest supported Linux, so libstdc++/glibc symbol versions stay
        # compatible (Task 22). The macOS deployment target comes from .cargo/config.toml.
        os: [macos-15, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Python reads cargo metadata and licence files as UTF-8 on Windows too.
      PYTHONUTF8: "1"
      EXE: ${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install   # reads rust-toolchain.toml
      - if: startsWith(matrix.os, 'windows')
        run: rustup component add llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/check-version.sh
      # Builds the release binary and checks Metal (macOS) and no OpenMP.
      - run: scripts/check-llama-build.sh --release
      - run: scripts/check-binary-deps.sh "target/release/orag$EXE" --release-floor
      # Windows and Linux also ship orag-vulkan (v0.6, D-001): in the CLI
      # archive and beside orag in the desktop bundle. Built with the Vulkan
      # SDK (Windows: Ninja and the MSVC environment, MSVC's linker named for
      # every later cargo step); its only extra import is the Vulkan loader.
      - if: ${{ !startsWith(matrix.os, 'macos') }}
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: 1.4.363.0
          stripdown: true
      - if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
      - if: startsWith(matrix.os, 'windows')
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$(cygpath -w "$(dirname "$(command -v cl)")/link.exe")" >> "$GITHUB_ENV"
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1
      - if: ${{ !startsWith(matrix.os, 'macos') }}
        run: |
          scripts/build-vulkan.sh --release
          # The SDK action points LD_LIBRARY_PATH at its own loader; a user's
          # system has only the distribution's.
          env -u LD_LIBRARY_PATH scripts/check-binary-deps.sh "target/vulkan/release/orag-vulkan$EXE" --release-floor --vulkan
      # Only the binaries that passed the checks above, in this run, are uploaded.
      - name: Name the artifact
        id: name
        run: |
          . scripts/version-lib.sh
          target=$(rustc -vV | sed -n 's/^host: //p')
          echo "artifact=orag-$(cargo_version)-${target}" >> "$GITHUB_OUTPUT"
      # A tarball keeps the executable bit, which an artifact zip would drop.
      - name: Package
        run: |
          dir="${{ steps.name.outputs.artifact }}"
          mkdir -p "dist/$dir/docs" "dist/$dir/assets"
          cp "target/release/orag$EXE" "dist/$dir/orag$EXE"
          if [ "$RUNNER_OS" != macOS ]; then
            cp "target/vulkan/release/orag-vulkan$EXE" "dist/$dir/orag-vulkan$EXE"
          fi
          cp LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md "dist/$dir/"
          cp docs/api.md "dist/$dir/docs/"
          cp assets/orag-icon.svg "dist/$dir/assets/"   # the README's header image
          scripts/third-party-licenses.sh "dist/$dir/THIRD-PARTY-LICENSES.md"
          if [ -n "$EXE" ]; then
            # Windows: a zip, which Explorer opens without extra tools.
            (cd dist && 7z a -tzip -bso0 "$dir.zip" "$dir")
            # 7-Zip lists Windows paths with backslashes and CRLF line ends.
            7z l "dist/$dir.zip" | tr -d '\r' | tr '\\' / | grep -qE " $dir/orag\.exe$"
            7z l "dist/$dir.zip" | tr -d '\r' | tr '\\' / | grep -qE " $dir/orag-vulkan\.exe$"
            echo "file=$dir.zip" >> "$GITHUB_ENV"
          else
            tar -C dist -czf "dist/$dir.tar.gz" "$dir"
            tar -tzvf "dist/$dir.tar.gz" | grep -E ' [^ ]*/orag$' | grep -q '^-rwx'
            if [ "$RUNNER_OS" = Linux ]; then
              tar -tzvf "dist/$dir.tar.gz" | grep -E ' [^ ]*/orag-vulkan$' | grep -q '^-rwx'
            fi
            echo "file=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: dist/${{ env.file }}
          if-no-files-found: error
      # Windows also ships an installer, smoke-tested before it is uploaded.
      - if: startsWith(matrix.os, 'windows')
        name: Installer
        run: |
          cargo build --release --locked --example ctrl_break
          choco install innosetup -y --no-progress
          scripts/build-windows-installer.sh installer
          . scripts/version-lib.sh
          scripts/smoke-windows-installer.sh "installer/ORAG-Setup-$(cargo_version).exe"
      - if: startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orag-installer
          path: installer/ORAG-Setup-*.exe
          if-no-files-found: error

      # The desktop app (D-016) around the same checked binary: bundled,
      # smoke-tested (page loads, its own POST passes, the sidecar ends with
      # the app) and uploaded.
      - if: startsWith(matrix.os, 'ubuntu')
        name: Desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      # macOS signing and notarization turn on only when the owner has added
      # the secrets (docs/signing.md); without them the app is built unsigned,
      # exactly as before. Tauri reads the APPLE_* variables itself. The secrets
      # get a value on the macOS runner only, never on Linux or Windows.
      - name: Desktop bundle
        env:
          SIGN_APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          SIGN_APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          SIGN_APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          SIGN_APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          SIGN_APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          SIGN_APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ -n "$SIGN_APPLE_CERTIFICATE" ]; then
            for v in CERTIFICATE CERTIFICATE_PASSWORD SIGNING_IDENTITY ID PASSWORD TEAM_ID; do
              src="SIGN_APPLE_$v"
              [ -n "${!src}" ] || { echo "secret APPLE_$v is missing; see docs/signing.md" >&2; exit 1; }
              export "APPLE_$v=${!src}"
              unset "$src"
            done
            echo "macOS: signing and notarizing as $APPLE_SIGNING_IDENTITY"
          else
            echo "no signing secrets: the desktop app is built unsigned"
          fi
          cargo install tauri-cli --version 2.12.3 --locked
          scripts/stage-sidecar.sh
          for bin in apps/desktop/binaries/orag-*$EXE; do
            case "$bin" in
              */orag-vulkan-*) env -u LD_LIBRARY_PATH scripts/check-binary-deps.sh "$bin" --release-floor --vulkan ;;
              *) scripts/check-binary-deps.sh "$bin" --release-floor ;;
            esac
          done
          case "$RUNNER_OS" in
            macOS) bundles=dmg ;;
            Windows) bundles=nsis ;;
            *) bundles=appimage,deb ;;
          esac
          (cd apps/desktop && cargo tauri build --bundles "$bundles" -- --locked)
          # Windows and Linux: the app tries orag-vulkan first and, on a
          # runner without a GPU, runs the CPU with the reason in its marker
          # (desktop.yml's missing-loader job covers a PC without Vulkan).
          gpu=()
          if [ "$RUNNER_OS" != macOS ]; then gpu=(--expect-gpu-fallback); fi
          if [ "$RUNNER_OS" = Linux ]; then
            env -u LD_LIBRARY_PATH xvfb-run -a scripts/smoke-desktop.sh "target/release/orag-desktop" "${gpu[@]}"
          else
            scripts/smoke-desktop.sh "target/release/orag-desktop$EXE" "${gpu[@]}"
          fi
          mkdir -p desktop-dist
          find target/release/bundle \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} desktop-dist/ \;
          ls -l desktop-dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orag-desktop-${{ matrix.os }}
          path: desktop-dist/*
          if-no-files-found: error

  # On a pushed version tag, a draft release with every artifact; the owner
  # reviews and publishes it. Manual runs and release-check branches only build.
  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # Build provenance: GitHub signs a statement that each file was built by
      # this workflow from this tag (`gh attestation verify`, docs/signing.md).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          scripts/write-checksums.sh dist
          cat dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do" >&2
            exit 1
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "ORAG ${TAG#v}" --notes "Draft for ${TAG}: see CHANGELOG.md. Check a download with SHA256SUMS or \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\` (docs/signing.md)."
