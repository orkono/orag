[env]
# README minimum macOS (scripts/platform-floors.sh MACOS_MIN, checked from Task 12).
# Without it llama.cpp targets the build machine's SDK. `force`: a
# MACOSX_DEPLOYMENT_TARGET in the shell cannot override it.
MACOSX_DEPLOYMENT_TARGET = { value = "14.0", force = true }
# llama-cpp-sys-2 builds llama.cpp with the static CRT (/MT) only when this
# is set; Rust uses it too (rustflags below), so orag.exe needs no VC++
# redistributable. Read only by the Windows build.
LLAMA_STATIC_CRT = "1"

# Windows x86-64 floor (scripts/platform-floors.sh WINDOWS_CPU_FLOOR): AVX2,
# FMA, F16C, BMI2 (Intel Haswell 2013+, AMD Zen). llama-cpp-sys-2 turns ggml's
# AVX2 kernels on from these target features (GGML_NATIVE stays off).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static,+avx2,+fma,+f16c,+bmi2"]
