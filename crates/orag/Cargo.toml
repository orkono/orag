[package]
name = "orag"
description = "Local-first, offline RAG engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published: the version test reads the workspace CHANGELOG.md.
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
html-escape = "0.2.15"
llama-cpp-2 = { version = "=0.1.158", default-features = false, optional = true }
# Only for the `vulkan` build: the fit call's log-level constant. Same version
# as llama-cpp-2's own dependency, so it adds no crate to the tree.
llama-cpp-sys-2 = { version = "=0.1.158", default-features = false, optional = true }
# Not used directly: pdf_oxide 0.3.78 does not compile with office_oxide >= 0.1.10
# (upstream added a struct field in a patch release). Remove when pdf_oxide is bumped.
office_oxide = "=0.1.9"
pdf_oxide = "=0.3.78"
pulldown-cmark = { version = "0.13.4", default-features = false }
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlite-vec = "=0.1.9"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = "0.1.19"
toml = "1.1.6"
# The setup page writes only `generation_model` into config.toml (step 82),
# keeping the user's comments and order. Pinned: it shares toml's parser crates.
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse", "display"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "=0.1.25"
unicode-segmentation = "1.13.3"
# Model download from the setup page (step 76): blocking HTTP/1.1, rustls with
# ring and the Mozilla roots (no OpenSSL, no aws-lc-rs: nothing to build with
# cmake/nasm under the static Windows CRT). Pinned: the idle-read limit wraps
# its `unversioned` transport API, which may change in any release.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.53.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[features]
default = ["llama"]
llama = ["dep:llama-cpp-2"]
# The `orag-vulkan` executable (v0.6, D-001): llama.cpp's Vulkan backend and
# the Rust API of its memory fit. Built by scripts/build-vulkan.sh into its own
# target directory; the CPU `orag` never enables it.
vulkan = ["llama", "llama-cpp-2/vulkan", "llama-cpp-2/common", "dep:llama-cpp-sys-2"]

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
# Already in the tree (via tokio/mio); job objects contain the parser child,
# Console sends Ctrl-Break in the installer smoke test (examples/ctrl_break.rs),
# Storage_FileSystem reports free disk space before a model download, and
# SystemInformation and LibraryLoader (dxgi.dll at run time) feed the setup
# page's machine probe (step 82).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading"] }
