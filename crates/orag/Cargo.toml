[package]
name = "orag"
description = "Local-first, offline RAG engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published: the version test reads the workspace CHANGELOG.md.
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
html-escape = "0.2.15"
llama-cpp-2 = { version = "=0.1.158", default-features = false, optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlite-vec = "=0.1.9"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = "0.1.19"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "=0.1.25"
unicode-segmentation = "1.13.3"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[features]
default = ["llama"]
llama = ["dep:llama-cpp-2"]
